<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harbor Point — Application (framed)</title>
  <style>
    :root{--ink:#101828;--soft:#475467;--mute:#98a2b3;--line:#e4e7ec;--paper:#fff;--brand:#334e9e;--brand-dk:#26397a;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;padding:22px}
    h2{font-size:18px;letter-spacing:-.01em;margin-bottom:2px}
    .sub{color:var(--soft);font-size:13px;margin-bottom:18px}
    .field{margin-bottom:13px}
    .field label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:5px}
    .field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--sans)}
    .field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .consent{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;color:var(--mute);line-height:1.5;margin:8px 0 16px}
    .consent input{margin-top:2px;flex-shrink:0}
    .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;width:100%}
    .btn:hover{background:var(--brand-dk)}
  </style>
</head>
<body>
  <h2>Free consultation</h2>
  <p class="sub">Tell us where to reach you — a specialist will call with your options.</p>
  <!-- GET navigation so the submit beacon survives the framed document's page transition -->
  <form id="app" action="thanks.html" method="get">
    <div class="field"><label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" required /></div>
    <div class="row">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required /></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" autocomplete="tel" required /></div>
    </div>
    <div class="row">
      <div class="field"><label for="debt_amount">Estimated debt</label>
        <select id="debt_amount" name="debt_amount" required>
          <option value="">Select…</option><option value="lt_10k">Under $10,000</option><option value="10k_25k">$10,000 - $25,000</option><option value="25k_50k">$25,000 - $50,000</option><option value="over_50k">$50,000+</option>
        </select></div>
      <div class="field"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" placeholder="e.g. TX" required /></div>
    </div>
    <label class="consent">
      <input type="checkbox" name="consent" required />
      <span>By clicking “Request my consultation,” I agree that Harbor Point Financial and its partner
        network may contact me at the phone number and email I provided, including by autodialed and
        prerecorded calls and text messages, regarding debt relief options, even if my number is on a
        state or national Do Not Call registry. Message and data rates may apply. Consent is not required
        to purchase any service, and I may withdraw it at any time.</span>
    </label>
    <button class="btn" type="submit">Request my consultation</button>
  </form>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KXJFVS2M"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
</body>
</html>
