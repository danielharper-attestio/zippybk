  <title>Thanks — TurboDebt test form (Attestio)</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #14181f; background: #f4f6f9; margin: 0; padding: 48px 16px; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 36px 32px; text-align: center; box-shadow: 0 8px 30px rgba(15,23,42,.08); }

    <div class="tick">✓</div>
    <h1>Thanks — submission received.</h1>
    <p>A debt specialist will review your application and call you shortly.
       This is the landing page the TurboDebt test form navigates to after submit.</p>
  </div>

  <!-- Site-wide Attestio install now comes from the GTM container in <head> (All Pages): the keyed
       tracker detects the post-submit handoff (certificate_id + attestio_epilogue URL params) and
       records a short EPILOGUE under the same certificate. The old hardcoded
       attestio.js snippet (placeholder key turbodebt-site) was REMOVED: the tracker resolves
       its site key and ingest origin from the first matching <script> in the DOM, so a stale tag
       here made the epilogue post to the wrong origin (HTTP 501 from the :8080 static server) and
       under a placeholder key. Same hazard for a real customer who leaves an old snippet behind
       when migrating to GTM — remove the old snippet. -->
</body>
